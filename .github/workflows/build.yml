# Checks every change, and turns each release into the image the sites are served from.
#
#   a pull request, or a push to main  ->  the checks
#   a tag like v1.2.0                  ->  the checks, then ghcr.io/pvrps/purps.ca:latest and :1.2.0
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test
      - run: bun run build

  image:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        shell: bash
        run: echo "tags=ghcr.io/pvrps/purps.ca:latest,ghcr.io/pvrps/purps.ca:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
